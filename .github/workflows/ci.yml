name: Build and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Run Tests
        run: swift test

      - name: Build Universal App (arm64 + x86_64)
        run: |
          make app
          lipo -info MiPods-Plus.app/Contents/MacOS/MiPodsPlus
          zip -r MiPods-Plus-macOS-universal.zip MiPods-Plus.app

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MiPods-Plus-macOS-universal
          path: MiPods-Plus-macOS-universal.zip

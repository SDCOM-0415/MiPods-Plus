name: Build and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Build
        run: swift build

      - name: Run Tests
        run: swift test

      - name: Bundle App
        run: |
          make app
          zip -r MiPods-Plus-macOS.zip MiPods-Plus.app

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MiPods-Plus-macOS
          path: MiPods-Plus-macOS.zip
